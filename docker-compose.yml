# Verificacion de paquetes platform sin Node/Go en el host.
# Contexto de build: directorio padre (el que contiene `platform/`).
#
# Desde platform/:
#   docker compose build

services:
  crud-ui-ts-check:
    build:
      context: ..
      dockerfile: platform/features/crud/ui/Dockerfile.ci-ts

  crud-paths-go-check:
    build:
      context: ..
      dockerfile: platform/features/crud/paths/Dockerfile.ci-go

  kanban-board-ts-check:
    build:
      context: ..
      dockerfile: platform/features/kanban-board/Dockerfile.ci-ts

  ui-data-display-ts-check:
    build:
      context: ..
      dockerfile: platform/ui/data-display/Dockerfile.ci-ts

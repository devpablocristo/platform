name: publish-ts-package

# Triggered when any TypeScript module tag is pushed.
# Each tag has the form <module-path>/v<semver> where <module-path> matches
# a directory in the workspace that contains a package.json.

on:
  push:
    tags:
      # L0 capabilities
      - "authn/ts/v*"
      - "browser/ts/v*"
      - "concurrency/fsm/ts/v*"
      - "http/ts/v*"
      # Cross-language contracts
      - "contracts/ai/ts/v*"
      # Lifecycle (added in Ola B)
      - "lifecycle/ts/v*"
      # Feature verticals
      - "features/admin-insights/ts/v*"
      - "features/calendar-board/ts/v*"
      - "features/conversation-inbox/ts/v*"
      - "features/crud/ui/ts/v*"
      - "features/kanban-board/ts/v*"
      - "features/notification-feed/ts/v*"
      - "features/scheduling/ts/v*"
      - "features/search/ts/v*"
      # UI primitives
      - "ui/data-display/ts/v*"
      - "ui/modal/ts/v*"
      - "ui/page-shell/ts/v*"
      - "ui/section-hub/ts/v*"
      - "ui/shell-sidebar/ts/v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20.19.0"
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve tagged module
        id: tag
        run: |
          tag="${GITHUB_REF_NAME}"
          module="${tag%/v*}"
          version="${tag##*/v}"
          echo "module=${module}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Validate tag matches VERSION
        run: |
          module="${{ steps.tag.outputs.module }}"
          version="${{ steps.tag.outputs.version }}"
          test -f "${module}/VERSION"
          actual="$(tr -d '[:space:]' < "${module}/VERSION")"
          if [[ "${actual}" != "${version}" ]]; then
            echo "tag/version mismatch: ${module} VERSION=${actual} tag=${version}" >&2
            exit 1
          fi

      - name: Test source module
        run: |
          module="${{ steps.tag.outputs.module }}"
          package_name="$(node -e "console.log(require('./${module}/package.json').name)")"
          pnpm install --no-frozen-lockfile
          pnpm --filter "${package_name}" run typecheck
          pnpm --filter "${package_name}" run test

      - name: Prepare release package
        run: |
          module="${{ steps.tag.outputs.module }}"
          outdir="$(mktemp -d)"
          python3 ./tooling/scripts/prepare-ts-package-release.py "${module}" "${outdir}"
          echo "PACKAGE_DIR=${outdir}" >> "$GITHUB_ENV"

      - name: Publish package (skip if version already on npm)
        run: |
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "missing NPM_TOKEN secret" >&2
            exit 1
          fi
          module="${{ steps.tag.outputs.module }}"
          version="${{ steps.tag.outputs.version }}"
          pkg_name="$(node -e "console.log(require('./${module}/package.json').name)")"
          # Idempotente: si la versión ya está publicada, salimos OK.
          existing="$(npm view "${pkg_name}@${version}" version 2>/dev/null || true)"
          if [[ -n "${existing}" ]]; then
            echo "::notice::${pkg_name}@${version} already on npm, skipping publish"
            exit 0
          fi
          cd "${PACKAGE_DIR}"
          # --ignore-scripts skips prepublishOnly which would re-run typecheck/test
          # against the prepared tarball directory (where node_modules is absent).
          # We already ran tests in the "Test source module" step.
          npm publish --access public --ignore-scripts

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: platform-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guardrails:
    name: Guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate runtime layout
        run: bash tooling/scripts/validate-runtime-layout.sh

      - name: Validate package boundaries
        run: npm run validate:boundaries

      - name: Validate module versions
        run: npm run validate:versions

      - name: Validate internal TS dependencies
        run: npm run validate:ts-deps

  go:
    name: Go
    runs-on: ubuntu-latest
    env:
      PLATFORM_POSTGRES_TEST_DSN: postgres://platform:platform@127.0.0.1:5432/platform_test?sslmode=disable
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: true

      - name: Test Go modules
        run: npm run test:go

  ts:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate internal TS dependencies
        run: npm run validate:ts-deps

      - name: Typecheck TS modules
        run: npm run typecheck:ts

      - name: Build TS modules
        run: npm run build:ts

      - name: Test TS modules
        run: npm run test:ts

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test Python modules
        run: npm run test:python

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test Rust modules
        run: npm run test:rust
